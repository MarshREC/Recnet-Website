<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0bdccc" />
    <title>MarshREC · recnet.xyz</title>
    <meta name="description" content="MarshREC's corner of the internet — socials, contact info, and more." />
    <link rel="canonical" href="https://recnet.xyz/" />
    <link rel="icon" href="assets/rec-marsh.png" type="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://recnet.xyz/" />
    <meta property="og:title" content="MarshREC" />
    <meta property="og:description" content="MarshREC's corner of the internet." />
    <meta property="og:image" content="https://recnet.xyz/assets/rec-marsh.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@500;600;700;800&display=swap');

      :root {
        --aqua: #12ded1;
        --mint: #98ffe9;
        --ink: #0c3d42;
        --dark: #062d32;
        --paper: #eafff9;
        --line: rgba(6, 45, 50, .16);
      }
      body.dark {
        --aqua: #2aead9;
        --mint: #99ffe8;
        --ink: #e2fffa;
        --dark: #031b20;
        --paper: #102e35;
        --line: rgba(173, 255, 241, .18);
        background:
          radial-gradient(circle at 12% 18%, rgba(26, 100, 106, .55), transparent 23rem),
          radial-gradient(circle at 85% 88%, rgba(0, 183, 169, .3), transparent 27rem),
          linear-gradient(135deg, #061c22, #083b42 50%, #07595d);
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        color: var(--ink);
        font-family: Outfit, system-ui, sans-serif;
        background:
          radial-gradient(circle at 12% 18%, rgba(255,255,255,.88), transparent 23rem),
          radial-gradient(circle at 85% 88%, rgba(24,235,195,.45), transparent 27rem),
          linear-gradient(135deg, #bffff3, #74e9db 48%, #18b8b7);
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        opacity: .19;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E");
      }
      main { width: min(93vw, 700px); padding: 56px 0; }
      .profile {
        position: relative;
        overflow: hidden;
        padding: 42px;
        border: 2px solid rgba(255,255,255,.7);
        border-radius: 32px;
        background: rgba(242,255,252,.74);
        box-shadow: 0 25px 65px rgba(0, 78, 82, .26), inset 0 1px rgba(255,255,255,.9);
        backdrop-filter: blur(13px);
        animation: rise .7s cubic-bezier(.2,.8,.2,1) both;
      }
      body.dark .profile { background: rgba(8, 43, 50, .78); border-color: rgba(151,255,237,.24); box-shadow: 0 25px 65px rgba(0,0,0,.4), inset 0 1px rgba(255,255,255,.08); }
      body.dark .link { background: rgba(255,255,255,.055); }
      body.dark .link:hover, body.dark .link:focus-visible { background: rgba(255,255,255,.12); box-shadow: 0 9px 20px rgba(0,0,0,.23); }
      body.dark .label span, body.dark .footer { color: #a8dcd5; }
      body.dark .eyebrow, body.dark .tagline strong, body.dark .arrow { color: var(--mint); }
      .profile::after {
        content: "";
        position: absolute;
        width: 300px; height: 300px;
        right: -165px; top: -180px;
        border: 28px solid rgba(18,222,209,.18);
        border-radius: 50%;
        pointer-events: none;
      }
      .top { display: flex; align-items: center; gap: 20px; position: relative; z-index: 1; }
      .theme-toggle {
        position: absolute; z-index: 2; top: 27px; right: 27px;
        display: inline-flex; align-items: center; gap: 7px;
        padding: 8px 11px; color: var(--ink); cursor: pointer;
        font: 500 .68rem 'DM Mono', monospace; border: 1px solid var(--line);
        border-radius: 999px; background: rgba(255,255,255,.5);
        transition: transform .2s ease, background .2s ease;
      }
      .theme-toggle:hover { transform: translateY(-2px); background: #fff; }
      body.dark .theme-toggle { background: rgba(255,255,255,.08); }
      .avatar-wrap { position: relative; flex: 0 0 auto; }
      .avatar-wrap::before {
        content: "";
        position: absolute; inset: -6px;
        border-radius: 25px;
        background: linear-gradient(145deg, var(--aqua), #fff 52%, #72e7b9);
        transform: rotate(-5deg);
      }
      .avatar {
        position: relative;
        display: block;
        width: 106px; height: 106px;
        object-fit: cover;
        border: 3px solid var(--paper);
        border-radius: 21px;
        background: var(--aqua);
      }
      .eyebrow { margin: 0 0 3px; font: 500 .73rem/1.2 'DM Mono', monospace; letter-spacing: .12em; color: #168d8b; }
      h1 { margin: 0; font-size: clamp(2.15rem, 8vw, 3.35rem); line-height: .92; letter-spacing: -.07em; }
      .status { display: inline-flex; align-items: center; gap: 7px; margin: 10px 0 0; font: 500 .78rem 'DM Mono', monospace; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #1fca8d; box-shadow: 0 0 0 4px rgba(31,202,141,.13); }
      .tagline { margin: 29px 0 23px; max-width: 420px; font-size: 1.05rem; line-height: 1.55; }
      .tagline strong { color: #008f8d; }
      .contact {
        margin: 0 0 24px; padding: 13px 15px;
        border-left: 4px solid var(--aqua); border-radius: 0 12px 12px 0;
        background: rgba(18,222,209,.11); font-size: .92rem; line-height: 1.45;
      }
      .contact b { font-family: 'DM Mono', monospace; font-size: .78rem; }
      .links { display: grid; gap: 10px; position: relative; z-index: 1; }
      .link {
        min-height: 67px;
        display: flex; align-items: center; gap: 15px;
        padding: 10px 14px;
        color: inherit; text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 17px;
        background: rgba(255,255,255,.57);
        transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      }
      .link:hover, .link:focus-visible { transform: translateX(6px); background: #fff; box-shadow: 0 9px 20px rgba(0,88,89,.12); outline: none; }
      .icon { width: 42px; height: 42px; flex: 0 0 42px; object-fit: contain; border-radius: 12px; background: #d6fff6; }
      .label { min-width: 0; display: grid; gap: 2px; }
      .label b { font-size: 1rem; line-height: 1; }
      .label span { overflow: hidden; color: #3b7779; font: .74rem 'DM Mono', monospace; text-overflow: ellipsis; white-space: nowrap; }
      .arrow { margin-left: auto; color: #009f9c; font-size: 1.5rem; transition: transform .2s ease; }
      .link:hover .arrow { transform: translateX(3px); }
      button.link { width: 100%; cursor: pointer; text-align: left; font: inherit; }
      .footer { margin: 18px 4px 0; text-align: center; color: rgba(5,61,65,.72); font: .7rem 'DM Mono', monospace; }
      .spark { position: absolute; right: 174px; top: 30px; color: var(--aqua); font-size: 2rem; animation: twinkle 2s ease-in-out infinite; }
      .toast { position: fixed; left: 50%; bottom: 24px; z-index: 4; padding: 10px 15px; color: white; font: .78rem 'DM Mono', monospace; background: var(--dark); border-radius: 999px; box-shadow: 0 8px 25px rgba(0,0,0,.18); transform: translate(-50%, 90px); opacity: 0; transition: .25s ease; }
      .toast.show { transform: translate(-50%, 0); opacity: 1; }
      @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } to { opacity: 1; transform: none; } }
      @keyframes twinkle { 50% { transform: rotate(17deg) scale(1.22); filter: brightness(1.13); } }
      @media (max-width: 450px) { .profile { padding: 52px 20px 26px; border-radius: 25px; } .top { gap: 15px; } .avatar { width: 88px; height: 88px; } .theme-toggle { top: 16px; right: 16px; } .spark { right: 148px; top: 17px; } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
  </head>
  <body>
    <main>
      <section class="profile" aria-label="MarshREC profile">
        <span class="spark" aria-hidden="true">✦</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode"><span aria-hidden="true">◐</span><span id="theme-label">dark mode</span></button>
        <div class="top">
          <div class="avatar-wrap">
            <img class="avatar" src="https://cdn.discordapp.com/attachments/1407319656158593086/1528292020848824480/mrblue.png?ex=6a5dc45c&amp;is=6a5c72dc&amp;hm=d76d5f9cefc01587df0645c29e340341013520ec33140b7fefa6fe1a8b5022fe" alt="MarshREC profile picture" />
          </div>
          <div><p class="eyebrow">WELCOME TO MY CORNER</p><h1>MarshREC</h1><p class="status"><span class="dot"></span> online-ish</p></div>
        </div>
        <p class="tagline">My little place on the internet. Find me around the web — <strong>say hi.</strong></p>
        <p class="contact"><b>CONTACT: DISCORD</b><br />I read all DMs — anybody can message me.</p>
        <div class="links">
          <button class="link" id="discord" type="button" aria-label="Copy Discord username ihatemiller"><img class="icon" src="https://cdn.discordapp.com/attachments/1407319656158593086/1528292585091629137/NpuAyAAAABklEQVQDAKnodHQ9y7UuAAAAAElFTkSuQmCC.png?ex=6a5dc4e2&amp;is=6a5c7362&amp;hm=9c40c9237365f72568a0d886a40e510289e5f9c64aa54706a8a68598c6f04203" alt="" /><span class="label"><b>Discord</b><span>ihatemiller · click to copy</span></span><span class="arrow">→</span></button>
          <a class="link" href="https://meowii.app" target="_blank" rel="noopener noreferrer"><img class="icon" src="https://cdn.discordapp.com/icons/1489788518040600720/ed07dc3d062de4fab9366f9f0a3b355c.webp?size=1536" alt="MeowNet logo" /><span class="label"><b>MeowNet</b><span>@marsh · meowii.app</span></span><span class="arrow">↗</span></a>
          <a class="link" href="https://www.tiktok.com/@marshmeta" target="_blank" rel="noopener noreferrer"><img class="icon" src="https://cdn.discordapp.com/attachments/1407319656158593086/1528293384198819850/2zVtQ0AAAAGSURBVAMAC6Sh0mDTJ4MAAAAASUVORK5CYII.png?ex=6a5dc5a1&amp;is=6a5c7421&amp;hm=1d57f6c9f8f7e08f2b3b24fd210e99eeb275c3b46564c54a5d50312a47fa5e1c" alt="TikTok logo" /><span class="label"><b>TikTok</b><span>@marshmeta</span></span><span class="arrow">↗</span></a>
          <a class="link" href="https://www.roblox.com/users/298917143/profile" target="_blank" rel="noopener noreferrer"><img class="icon" src="https://cdn.discordapp.com/attachments/1407319656158593086/1528294167174844588/3y3MkAAAAGSURBVAMAb1spQmla8j0AAAAASUVORK5CYII.png?ex=6a5dc65b&amp;is=6a5c74db&amp;hm=079065bf463e7655fd970e614282497c2e0f05dba2acd4df2a0d0880e8bd5ba9" alt="Roblox logo" /><span class="label"><b>Roblox</b><span>verxionii</span></span><span class="arrow">↗</span></a>
        </div>
      </section>
      <p class="footer">MADE FOR MARSHREC ✦ 2026</p>
    </main>
    <div class="toast" id="toast" role="status">Discord username copied!</div>
    <script>
      const toast = document.getElementById('toast');
      document.getElementById('discord').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText('ihatemiller'); } catch { /* clipboard may be unavailable */ }
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2200);
      });
      const themeToggle = document.getElementById('theme-toggle');
      const themeLabel = document.getElementById('theme-label');
      const savedTheme = localStorage.getItem('marshrec-theme');
      function setTheme(dark) {
        document.body.classList.toggle('dark', dark);
        themeLabel.textContent = dark ? 'light mode' : 'dark mode';
        themeToggle.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      }
      setTheme(savedTheme === 'dark');
      themeToggle.addEventListener('click', () => {
        const dark = !document.body.classList.contains('dark');
        setTheme(dark);
        localStorage.setItem('marshrec-theme', dark ? 'dark' : 'light');
      });
    </script>
  </body>
</html>
